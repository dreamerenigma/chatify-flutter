name: chatify
description: Applications for messaging, calling and creating shared groups
publish_to: 'none'
version: 1.4.7+711
repository: https://github.com/dreamerenigma/chatify-flutter

environment:
  sdk: ^3.12.1

#-------------------- PACKAGES --------------------#
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Utility Packages
  http: ^1.6.0
  intl: ^0.20.2
  path: ^1.9.1
  logger: ^2.7.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  emoji_picker_flutter: ^4.5.4
  gif: ^2.3.0
  flutter_notification_channel: ^3.2.0
  image_gallery_saver_plus: ^5.1.1
  dio: ^5.11.0
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.1
  yaml: ^3.1.3
  video_player: ^2.14.0
  file_picker: ^12.1.2
  flutter_cache_manager: ^3.4.2
  connectivity_plus: ^7.3.1
  record: ^7.1.1
  share_plus: ^13.3.0
  receive_sharing_intent: ^1.9.0
  provider: ^6.1.5+1
  camera: ^0.12.0+2
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  mailer: ^7.2.0
  audio_session: ^0.2.4
  dotted_border: ^3.1.0
  qr_flutter: ^4.1.0
  android_intent_plus: ^6.1.0
  shimmer: ^4.0.0
  flutter_svg: ^2.3.0
  yandex_mapkit: ^4.3.0
  flutter_contacts: ^1.1.9+2
  local_auth: ^3.0.2
  mime: ^2.0.0
  flutter_dotenv: ^6.0.1
  window_manager: ^0.5.2
  camera_windows: ^0.2.6+5
  flutter_phoenix: ^1.1.1
  flutter_screenutil: ^5.9.3
  get_it: ^9.2.1
  dartz: ^0.10.1
  equatable: ^2.1.0
  ffi: ^2.2.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  process_run: ^1.3.5
  universal_html: ^2.3.0
  get_video_thumbnail: ^0.9.0
  flutter_webrtc: ^1.6.0
  flutter_local_notifications: ^22.3.0
  uuid: ^4.6.0
  image: ^4.9.2
  flutter_markdown_plus: ^1.0.12
  win32: ^6.4.0
  gif_view: ^1.0.3
  agora_rtc_engine: ^6.6.4
  just_audio: ^0.10.6
  shared_preferences: ^2.5.5

  # Icons
  akar_icons_flutter: ^1.1.21
  cupertino_icons: ^1.0.9
  fluentui_system_icons: ^1.1.273
  bootstrap_icons: ^1.13.1+3
  iconic: ^0.1.0
  mono_icons: ^1.0.0+2
  hugeicons: ^1.1.7
  heroicons: ^0.11.0
  flutter_material_design_icons: ^3.1.0+7447
  iconify_flutter: ^0.0.7
  iconsax_plus: ^1.0.0
  remixicon: ^4.9.3
  unicons: ^3.0.0

  # State Management
  get: ^4.7.3
  get_storage: ^2.1.1

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  firebase_storage: ^13.5.0
  firebase_messaging: ^16.6.0
  firebase_app_check: ^0.4.7
  googleapis_auth: ^2.3.3
  googleapis: ^17.0.0
#-------------------- ./ PACKAGES END --------------------#

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Utility Packages
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  intl_utils: ^2.8.16
  build_runner: ^2.11.1
  build_config: ^1.3.2
  build_version: ^2.1.3

flutter_intl:
  enabled: true
  arb_dir: lib/localization/l10n
  output_dir: lib/generated/l10n

flutter:
  uses-material-design: true
  generate: true

  #-------------------- LOCAL ASSETS --------------------#
  assets:
    - assets/fonts/
    - assets/icons/auth/
    - assets/images/
    - assets/images/background/
    - assets/images/logos/
    - assets/images/solid_colors/
    - assets/images/wallpapers/
    - assets/sounds/
    - assets/vectors/
    - assets/vectors/flags/
    - assets/licenses/

  #-------------------- LOCAL FONTS --------------------#
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 800
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica/Helvetica-Light.otf
          weight: 300
        - asset: assets/fonts/Helvetica/Helvetica-Regular.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Helvetica/Helvetica-Italic.otf
          weight: 500
        - asset: assets/fonts/Helvetica/Helvetica-Bold.otf
          weight: 800
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi/Satoshi-Light.ttf
          weight: 300
        - asset: assets/fonts/Satoshi/Satoshi-Regular.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi/Satoshi-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Satoshi/Satoshi-Bold.ttf
          weight: 800
    - family: Coolvetica
      fonts:
        - asset: assets/fonts/Coolvetica/Coolvetica-Italic.otf
          style: italic
        - asset: assets/fonts/Coolvetica/Coolvetica-Regular.otf
          weight: 400
